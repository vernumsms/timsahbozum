name: Kirik link kontrolu

# Pages deploy'u tamamlandiktan sonra ve haftada bir tum sitedeki linkleri denetler.
# Blog otomasyonu insan onayi olmadan yayin yaptigi icin bekci gorevi gorur.
# push aninda kosunca yeni sayfa henuz canliya cikmadigi icin kendi URL'si
# 404 donuyordu (yaris durumu, 13.08.2026). workflow_run da ise yaramadi:
# "pages build and deployment" dinamik workflow oldugundan tetiklemiyor.
# deployment_status ise Pages deploy'u sonuclaninca GitHub'in yayinladigi
# gercek repo olayi.

on:
  deployment_status:
  schedule:
    - cron: '0 6 * * 1' # her pazartesi 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    # Sadece basarili deploy'da kos; basarisiz deploy'da yanlis alarm uretir.
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    steps:
      - uses: actions/checkout@v4

      # Deploy bitse de CDN'e yayilma birkac saniye surebilir.
      - name: CDN yayilmasini bekle
        if: github.event_name == 'deployment_status'
        run: sleep 30

      - name: Link kontrolu (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # wa.me / whatsapp.com bot isteklerini engelleyebiliyor, fontlar CDN;
          # 403/429 kabul: bazi siteler CI botlarini engelliyor, yanlis alarm olmasin.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --accept '200..=299,403,429'
            --exclude 'wa\.me'
            --exclude 'whatsapp\.com'
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            './*.html' './blog/*.html'
          fail: true
